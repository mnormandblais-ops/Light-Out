<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Lights Out Puzzle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b12;
            color: #00e5ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.25);
            border-radius: 15px;
            background: #121224;
            padding: 20px;
            border: 2px solid #00e5ff;
        }
        canvas {
            display: block;
            border-radius: 8px;
            cursor: pointer;
        }
        #hud {
            width: 450px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }
        .stat-val {
            color: #fff;
        }
        #win-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 11, 18, 0.95);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
            z-index: 10;
        }
        #win-screen h1 {
            color: #00ff66;
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
        }
        #btn-reset {
            margin-top: 25px;
            padding: 12px 30px;
            background: transparent;
            border: 2px solid #00e5ff;
            color: #00e5ff;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
            transition: 0.2s;
        }
        #btn-reset:hover {
            background: #00e5ff;
            color: #0b0b12;
            box-shadow: 0 0 25px #00e5ff;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div>MOVES: <span id="hud-moves" class="stat-val">0</span></div>
        <div>GRID: <span class="stat-val">5 x 5</span></div>
    </div>

    <div id="game-container">
        <canvas id="puzzleCanvas" width="450" height="450"></canvas>
        
        <div id="win-screen">
            <h1>GRID CLEAR</h1>
            <p id="win-stats">System restored in 0 moves!</p>
            <button id="btn-reset" onclick="initGame()">ENGAGE NEW MATRIX</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('puzzleCanvas');
const ctx = canvas.getContext('2d');

// --- UI Elements ---
const movesEl = document.getElementById('hud-moves');
const winScreen = document.getElementById('win-screen');
const winStatsText = document.getElementById('win-stats');

// --- Game Settings ---
const GRID_SIZE = 5;
const CELL_SIZE = canvas.width / GRID_SIZE;

// --- State Variables ---
let grid = []; // 2D array of booleans (true = light is ON, false = light is OFF)
let moves = 0;
let isWon = false;

// --- Puzzle Matrix Logic ---
function toggleNode(r, c) {
    if (r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE) {
        grid[r][c] = !grid[r][c];
    }
}

function processClick(r, c) {
    if (isWon) return;

    moves++;
    movesEl.innerText = moves;

    // Toggle target + cross pattern configuration
    toggleNode(r, c);       // Center
    toggleNode(r - 1, c);   // Up
    toggleNode(r + 1, c);   // Down
    toggleNode(r, c - 1);   // Left
    toggleNode(r, c + 1);   // Right

    checkWinCondition();
    draw();
}

// Scramble algorithm guarantees a solvable puzzle state by simulating clicks backwards
function scrambleMatrix() {
    grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(false));
    
    // Perform random valid operations to create the puzzle state
    for (let i = 0; i < 25; i++) {
        let randR = Math.floor(Math.random() * GRID_SIZE);
        let randC = Math.floor(Math.random() * GRID_SIZE);
        
        // Emulate reverse matrix changes directly without incrementing score track
        toggleNode(randR, randC);
        toggleNode(randR - 1, randC);
        toggleNode(randR + 1, randC);
        toggleNode(randR, randC - 1);
        toggleNode(randR, randC + 1);
    }

    // Verify it didn't somehow scramble back to a clean sheet
    if (verifyCleanSheet()) scrambleMatrix();
}

function verifyCleanSheet() {
    for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
            if (grid[r][c]) return false;
        }
    }
    return true;
}

function checkWinCondition() {
    if (verifyCleanSheet()) {
        isWon = true;
        winStatsText.innerText = `Matrix cleared successfully in ${moves} optimization steps!`;
        winScreen.style.display = 'flex';
    }
}

function initGame() {
    moves = 0;
    isWon = false;
    movesEl.innerText = "0";
    winScreen.style.display = 'none';
    scrambleMatrix();
    draw();
}

// --- Dynamic Canvas Core Vector Graphics Engine ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grid Base Matte Color
    ctx.fillStyle = '#16162d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
            const x = c * CELL_SIZE;
            const y = r * CELL_SIZE;
            const pad = 8; // Margin spacer inside individual grid cell nodes
            
            const isLightOn = grid[r][c];

            // Render vector box elements
            ctx.save();
            ctx.translate(x + pad, y + pad);
            
            const w = CELL_SIZE - (pad * 2);

            if (isLightOn) {
                // Active Glowing Nodes
                let glowGrad = ctx.createRadialGradient(w/2, w/2, 2, w/2, w/2, w * 0.7);
                glowGrad.addColorStop(0, '#ffffff');
                glowGrad.addColorStop(0.2, '#00e5ff');
                glowGrad.addColorStop(1, '#004488');
                ctx.fillStyle = glowGrad;

                // Canvas Native Vector Bloom Shadow
                ctx.shadowBlur = 18;
                ctx.shadowColor = '#00e5ff';
                
                ctx.beginPath();
                ctx.roundRect(0, 0, w, w, 10);
                ctx.fill();
            } else {
                // Dull inactive Node states
                ctx.fillStyle = '#0f0f1c';
                ctx.strokeStyle = '#252542';
                ctx.lineWidth = 2;
                
                ctx.beginPath();
                ctx.roundRect(0, 0, w, w, 10);
                ctx.fill();
                ctx.stroke();

                // Small center indicator notch
                ctx.fillStyle = '#1f1f38';
                ctx.beginPath();
                ctx.arc(w/2, w/2, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }
    }
}

// --- Click Event Interceptor Hook Engine ---
canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    const targetCol = Math.floor(clickX / CELL_SIZE);
    const targetRow = Math.floor(clickY / CELL_SIZE);

    processClick(targetRow, targetCol);
});

// Boot Logic Initializer Execution
initGame();
</script>
</body>
</html>
